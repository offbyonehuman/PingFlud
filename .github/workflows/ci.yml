name: CI

on:
  push:
    branches: [main, audit-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore PingFlud.sln -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905'

      - name: Build
        run: dotnet build PingFlud.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test PingFlud.sln -c Release --no-build --nologo

      - name: Audit known package vulnerabilities
        shell: pwsh
        run: |
          $projects = @(
            'src/PingFlud.Core/PingFlud.Core.csproj',
            'src/PingFlud.App/PingFlud.App.csproj',
            'src/PingFlud.Application/PingFlud.Application.csproj',
            'src/PingFlud.WinUI/PingFlud.WinUI.csproj',
            'tests/PingFlud.Core.Tests/PingFlud.Core.Tests.csproj',
            'tests/PingFlud.App.Tests/PingFlud.App.Tests.csproj',
            'tests/PingFlud.Application.Tests/PingFlud.Application.Tests.csproj'
          )
          foreach ($project in $projects) {
            $frameworks = if ($project -like '*PingFlud.Application.csproj') {
              @('net8.0', 'net8.0-windows')
            } else {
              @($null)
            }

            foreach ($framework in $frameworks) {
              $arguments = @('list', $project, 'package', '--vulnerable', '--include-transitive', '--format', 'json')
              if ($null -ne $framework) { $arguments += @('--framework', $framework) }
              $json = dotnet @arguments | Out-String
              if ($LASTEXITCODE) { exit $LASTEXITCODE }

              $report = $json | ConvertFrom-Json
              $vulnerable = foreach ($projectReport in @($report.projects)) {
                foreach ($frameworkReport in @($projectReport.frameworks)) {
                  foreach ($package in @($frameworkReport.topLevelPackages) + @($frameworkReport.transitivePackages)) {
                    if ($null -ne $package.vulnerabilities -and @($package.vulnerabilities).Count -gt 0) { $package }
                  }
                }
              }
              if (@($vulnerable).Count -gt 0) {
                $vulnerable | ConvertTo-Json -Depth 10
                throw "Vulnerable packages found in $project ($framework)."
              }
            }
          }

      - name: Publish and package release artifacts
        shell: pwsh
        run: |
          ./build-all.ps1
          python package_release.py
