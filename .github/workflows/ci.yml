name: CI

on:
  push:
    branches: [main, audit-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PingFlud.sln

      - name: Build
        run: dotnet build PingFlud.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test PingFlud.sln -c Release --no-build --nologo

      - name: Audit known package vulnerabilities
        shell: pwsh
        run: |
          $projects = @(
            'src/PingFlud.Core/PingFlud.Core.csproj',
            'src/PingFlud.App/PingFlud.App.csproj',
            'src/PingFlud.Application/PingFlud.Application.csproj',
            'src/PingFlud.WinUI/PingFlud.WinUI.csproj',
            'tests/PingFlud.Core.Tests/PingFlud.Core.Tests.csproj',
            'tests/PingFlud.App.Tests/PingFlud.App.Tests.csproj',
            'tests/PingFlud.Application.Tests/PingFlud.Application.Tests.csproj'
          )
          foreach ($project in $projects) {
            if ($project -like '*PingFlud.Application.csproj') {
              dotnet list $project package --vulnerable --include-transitive --framework net8.0
            } else {
              dotnet list $project package --vulnerable --include-transitive
            }
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
